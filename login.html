<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        studio: {
                            50: '#faf6f3',
                            100: '#f4ede6',
                            200: '#ebd9cd',
                            300: '#dfbcab',
                            400: '#cf9881',
                            500: '#c27b60',
                            600: '#b5644a',
                            700: '#98503b',
                            800: '#7f4433',
                            900: '#67392c',
                            950: '#361b14',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <title>Login - Paws & Pose</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body class="bg-studio-50 dark:bg-neutral-900 text-gray-900 dark:text-gray-100 min-h-screen flex items-center justify-center relative">
    
    <!-- Controls -->
    <div class="absolute top-8 right-8 flex gap-x-4">
        <button class="theme-toggle w-10 h-10 flex items-center justify-center text-gray-500 dark:text-gray-400 hover:text-studio-500 bg-white dark:bg-neutral-900 border border-gray-200 dark:border-neutral-700 shadow-sm hover:border-studio-300 dark:hover:border-studio-700 rounded-full transition-all focus:outline-none">
            <i class="fas fa-moon text-lg dark:hidden"></i>
            <i class="fas fa-sun text-lg hidden dark:block"></i>
        </button>
        <button class="rtl-toggle w-auto h-10 px-4 gap-x-2 flex items-center justify-center text-gray-500 dark:text-gray-400 hover:text-studio-500 bg-white dark:bg-neutral-900 border border-gray-200 dark:border-neutral-700 shadow-sm hover:border-studio-300 dark:hover:border-studio-700 rounded-full font-bold text-xs transition-all focus:outline-none">RTL</button>
    </div>
    
    <!-- Login Form Area -->
    <div class="w-full max-w-md bg-white dark:bg-neutral-950 p-8 sm:p-10 rounded-3xl shadow-xl border border-gray-100 dark:border-neutral-800 m-4">
            <div class="mb-10 text-center">
                <a href="index.html" class="inline-flex items-center justify-center text-3xl font-bold text-studio-900 dark:text-studio-200 mb-2">
                    <i class="fas fa-paw text-studio-500 mr-2 rtl:ml-2 rtl:mr-0 text-3xl"></i>
                    Paws & <span class="text-studio-500 ml-1 rtl:mr-1 rtl:ml-0">Pose</span>
                </a>
                <h1 class="text-2xl font-semibold mt-2">Welcome back</h1>
                <p class="text-gray-500 text-sm mt-2">Please enter your details to access your account.</p>
            </div>
            
            <form class="space-y-6">
                <div>
                    <label class="block text-sm font-medium mb-2">Email Address</label>
                    <input type="email" class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-neutral-800 bg-transparent focus:outline-none focus:ring-2 focus:ring-studio-500 transition-shadow" placeholder="hello@example.com" required>
                </div>
                <div>
                    <div class="flex justify-between mb-2">
                        <label class="block text-sm font-medium">Password</label>
                        <a href="#" class="text-sm text-studio-600 dark:text-studio-400 hover:underline">Forgot password?</a>
                    </div>
                    <div class="relative">
                        <input type="password" id="password" class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-neutral-800 bg-transparent focus:outline-none focus:ring-2 focus:ring-studio-500 transition-shadow pr-12 rtl:pl-12 rtl:pr-0" placeholder="••••••••" required>
                        <button type="button" onclick="togglePassword('password')" class="absolute inset-y-0 right-0 rtl:left-0 rtl:right-auto px-4 flex items-center text-gray-500 hover:text-studio-500 focus:outline-none">
                            <i class="far fa-eye" id="password-icon"></i>
                        </button>
                    </div>
                </div>
                <div class="flex items-center gap-x-2">
                    <input type="checkbox" id="remember" class="w-4 h-4 text-studio-600 border-gray-300 rounded focus:ring-studio-500">
                    <label for="remember" class="text-sm text-gray-600 dark:text-gray-400">Remember for 30 days</label>
                </div>
                
                <a href="dashboard.html" class="block w-full py-3 px-4 bg-studio-600 hover:bg-studio-700 text-white text-center font-medium rounded-xl transition-colors shadow-lg shadow-studio-500/20 whitespace-nowrap">Sign in</a>
                
                <div class="mt-6">
                    <div class="relative">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-gray-200 dark:border-neutral-800"></div>
                        </div>
                        <div class="relative flex justify-center text-sm">
                            <span class="px-2 bg-white dark:bg-neutral-950 text-gray-500">Or continue with</span>
                        </div>
                    </div>

                    <div class="mt-6 grid grid-cols-2 gap-4">
                        <a href="#" class="w-full flex items-center justify-center px-4 py-2 border border-gray-300 dark:border-neutral-700 rounded-xl shadow-sm bg-white dark:bg-neutral-900 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-neutral-800 transition-colors">
                            <i class="fab fa-google mr-2 rtl:ml-2 rtl:mr-0 text-[#4285F4]"></i> Google
                        </a>
                        <a href="#" class="w-full flex items-center justify-center px-4 py-2 border border-gray-300 dark:border-neutral-700 rounded-xl shadow-sm bg-white dark:bg-neutral-900 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-neutral-800 transition-colors">
                            <i class="fab fa-apple mr-2 rtl:ml-2 rtl:mr-0 text-black dark:text-white"></i> Apple
                        </a>
                    </div>
                </div>
            </form>
            
            <p class="mt-8 text-center text-sm text-gray-600 dark:text-gray-400">
                Don't have an account? <a href="signup.html" class="font-medium text-studio-600 dark:text-studio-400 hover:underline">Sign up</a>
            </p>
        </div>
    
    <button id="back-to-top" class="hidden fixed bottom-8 right-8 z-50 bg-studio-600 hover:bg-studio-700 text-white rounded-full w-12 h-12 flex items-center justify-center shadow-lg transition-transform hover:-translate-y-1 focus:outline-none whitespace-nowrap">
        <i class="fas fa-arrow-up"></i>
    </button>
    
    <script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(inputId + '-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
    <script src="script.js"></script>

</body>
</html>
